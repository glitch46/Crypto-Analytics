<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Situation: Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --gradient-primary: linear-gradient(135deg, #ff6b6b 0%, #ff2d92 100%);
      --gradient-hover: linear-gradient(135deg, #ff5252 0%, #e91e7b 100%);
      --accent-solid: #ff4d7d;
      --black-deep: #000000;
      --black-rich: #0a0a0b;
      --black-elevated: #121214;
      --gray-dark: #1a1a1e;
      --gray-mid: #2a2a30;
      --gray-muted: #6b6b76;
      --gray-light: #9999a5;
      --white-soft: #e8e8ed;
      --white-pure: #ffffff;
      --success: #00d26a;
      --warning: #ffb800;
      --danger: #ff4444;
      --info: #00b4d8;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 30px #ff4d7d30;
      --glow-ring: 0 0 0 4px #ff4d7d20;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", "Inter", -apple-system, sans-serif;
      background: radial-gradient(circle at top, #18181d 0%, #050506 45%, #000000 100%);
      color: var(--white-soft);
    }

    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px;
      padding: 32px 20px;
      background: linear-gradient(180deg, #0b0b0f 0%, #050506 100%);
      border-right: 1px solid var(--gray-dark);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 0;
      align-self: flex-start;
      height: 100vh;
    }

    .sidebar-title {
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--gray-light);
    }

    .sidebar-nav { display: grid; gap: 10px; }

    .sidebar-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 12px;
      border: 1px solid transparent;
      background: var(--black-rich);
      color: var(--white-soft);
      text-decoration: none; font-weight: 600;
      transition: all 200ms ease-out;
    }

    .sidebar-link:hover, .sidebar-link.active {
      border-color: #ff4d7d70;
      box-shadow: var(--shadow-sm);
      color: var(--white-pure);
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 48px 24px 80px;
      flex: 1;
    }

    .panel {
      background: var(--black-rich);
      border: 1px solid var(--gray-dark);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-md);
    }

    .grid { display: grid; gap: 24px; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-6 { grid-template-columns: repeat(6, 1fr); }

    /* Hero */
    .hero { text-align: center; margin-bottom: 32px; }
    .hero h1 {
      font-size: 36px; font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin: 0 0 8px;
    }
    .hero .subtitle {
      font-size: 14px; color: var(--gray-light);
      letter-spacing: 0.05em;
    }
    .hero .updated {
      font-size: 12px; color: var(--gray-muted);
      margin-top: 8px;
    }

    /* Status Banner */
    .status-banner {
      border-radius: 16px;
      padding: 20px 28px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      border: 1px solid;
    }
    .status-banner.level-LOW {
      background: linear-gradient(135deg, #0a1a0a 0%, #0a0a0b 100%);
      border-color: #00d26a40;
    }
    .status-banner.level-ELEVATED {
      background: linear-gradient(135deg, #1a1a0a 0%, #0a0a0b 100%);
      border-color: #ffb80040;
    }
    .status-banner.level-HIGH {
      background: linear-gradient(135deg, #1a0f0a 0%, #0a0a0b 100%);
      border-color: #ff6b3540;
    }
    .status-banner.level-CRITICAL {
      background: linear-gradient(135deg, #1a0a0a 0%, #0a0a0b 100%);
      border-color: #ff444480;
      animation: pulse-border 2s ease-in-out infinite;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: #ff444480; }
      50% { border-color: #ff4444cc; }
    }

    .status-level {
      font-size: 13px; font-weight: 800;
      letter-spacing: 0.15em; text-transform: uppercase;
      padding: 6px 16px; border-radius: 8px;
      white-space: nowrap;
    }
    .status-level.LOW { background: #00d26a30; color: #00d26a; }
    .status-level.ELEVATED { background: #ffb80030; color: #ffb800; }
    .status-level.HIGH { background: #ff6b3530; color: #ff6b35; }
    .status-level.CRITICAL { background: #ff444430; color: #ff4444; }

    .status-text {
      font-size: 14px; color: var(--white-soft);
      line-height: 1.5;
    }

    .status-score {
      margin-left: auto;
      text-align: center;
      white-space: nowrap;
    }
    .status-score .number {
      font-size: 32px; font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .status-score .label {
      font-size: 10px; color: var(--gray-muted);
      text-transform: uppercase; letter-spacing: 0.1em;
    }

    /* KPI Cards */
    .kpi-card {
      background: var(--black-rich);
      border: 1px solid var(--gray-dark);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }
    .kpi-label {
      font-size: 11px; font-weight: 700;
      color: var(--gray-light); text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 8px;
    }
    .kpi-value {
      font-size: 26px; font-weight: 800;
      color: var(--white-pure); margin-bottom: 6px;
    }
    .kpi-changes {
      display: flex; justify-content: center; gap: 10px;
      font-size: 11px; font-weight: 600;
    }
    .kpi-changes .positive { color: var(--success); }
    .kpi-changes .negative { color: var(--danger); }
    .kpi-changes .neutral { color: var(--gray-muted); }
    .kpi-detail {
      font-size: 11px; color: var(--gray-muted); margin-top: 4px;
    }

    /* Transmission Chain */
    .chain-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 24px;
    }
    .chain-node {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      padding: 14px 18px; border-radius: 12px;
      border: 2px solid; min-width: 130px;
      text-align: center;
    }
    .chain-node.green { border-color: #00d26a60; background: #00d26a10; }
    .chain-node.yellow { border-color: #ffb80060; background: #ffb80010; }
    .chain-node.red { border-color: #ff444460; background: #ff444415; }
    .chain-node .node-label {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .chain-node.green .node-label { color: #00d26a; }
    .chain-node.yellow .node-label { color: #ffb800; }
    .chain-node.red .node-label { color: #ff4444; }
    .chain-node .node-status {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--gray-muted);
    }
    .chain-arrow {
      font-size: 20px; color: var(--gray-muted); font-weight: 700;
    }

    /* Section Headers */
    .section-header {
      font-size: 18px; font-weight: 700;
      color: var(--white-pure);
      margin: 40px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--gray-dark);
    }

    /* Chart Containers */
    .chart-box {
      background: var(--black-rich);
      border: 1px solid var(--gray-dark);
      border-radius: 16px;
      padding: 20px;
    }
    .chart-box h3 {
      font-size: 14px; font-weight: 700;
      color: var(--white-soft); margin: 0 0 16px;
    }
    .chart-wrapper {
      position: relative;
      height: 280px;
    }
    .chart-wrapper.tall { height: 340px; }

    /* Narrative Panel */
    .narrative-section {
      margin-bottom: 20px;
    }
    .narrative-section h4 {
      font-size: 13px; font-weight: 700;
      color: var(--accent-solid);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 8px;
    }
    .narrative-section p {
      font-size: 14px; line-height: 1.7;
      color: var(--white-soft); margin: 0;
    }

    /* Key Levels */
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .level-card {
      display: flex; justify-content: space-between;
      align-items: center; padding: 12px 16px;
      background: var(--black-elevated);
      border-radius: 10px; border: 1px solid var(--gray-dark);
    }
    .level-card .level-name {
      font-size: 12px; font-weight: 600; color: var(--gray-light);
    }
    .level-card .level-value {
      font-size: 14px; font-weight: 700; color: var(--white-pure);
    }
    .level-card.breached {
      border-color: #ff444460;
      background: #ff444410;
    }
    .level-card.breached .level-value { color: #ff4444; }

    /* Correlation Badge */
    .corr-badges {
      display: flex; gap: 12px; justify-content: center;
      margin-top: 12px; flex-wrap: wrap;
    }
    .corr-badge {
      font-size: 11px; font-weight: 700;
      padding: 5px 12px; border-radius: 20px;
      background: var(--black-elevated);
      border: 1px solid var(--gray-dark);
      color: var(--white-soft);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .layout { flex-direction: column; }
      .sidebar {
        width: 100%; height: auto; position: static;
        flex-direction: row; flex-wrap: wrap;
      }
      .grid-6 { grid-template-columns: repeat(3, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .page { padding: 32px 16px 64px; }
      .grid-6 { grid-template-columns: repeat(2, 1fr); }
      .hero h1 { font-size: 24px; }
      .status-banner { flex-direction: column; text-align: center; }
      .status-score { margin-left: 0; }
      .chain-container { flex-direction: column; }
      .chain-arrow { transform: rotate(90deg); }
    }

    .loading {
      text-align: center; padding: 80px;
      color: var(--gray-muted); font-size: 14px;
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">Dashboards</div>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="../Trading-Indicators/index.html">Trading Indicators</a>
      <a class="sidebar-link" href="../Crypto-Dashboard/index.html">Options Intelligence</a>
      <a class="sidebar-link" href="../Backtest-Dashboard/index.html">Skew Backtest</a>
      <a class="sidebar-link" href="../Strategy-Tester/index.html">Strategy Tester</a>
      <a class="sidebar-link active" href="index.html">The Situation</a>
    </nav>
  </aside>

  <div class="page" id="app">
    <div class="loading">Loading situation data...</div>
  </div>
</div>

<script>
const DATA_URL = 'data/situation.json';

// ── Helpers ──────────────────────────────────────────────────────────────────
function fmt(v, decimals = 2) {
  if (v == null) return '—';
  return Number(v).toFixed(decimals);
}
function fmtChg(v) {
  if (v == null) return '<span class="neutral">—</span>';
  const cls = v > 0 ? 'positive' : v < 0 ? 'negative' : 'neutral';
  const sign = v > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${v.toFixed(2)}%</span>`;
}
function statusColor(status) {
  return { green: '#00d26a', yellow: '#ffb800', red: '#ff4444' }[status] || '#6b6b76';
}

const chartDefaults = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: {
    legend: { labels: { color: '#9999a5', font: { family: 'Plus Jakarta Sans', size: 11 } } },
    tooltip: {
      backgroundColor: '#1a1a1e',
      titleColor: '#fff',
      bodyColor: '#e8e8ed',
      borderColor: '#2a2a30',
      borderWidth: 1,
    },
  },
  scales: {
    x: {
      ticks: { color: '#6b6b76', font: { size: 10 }, maxTicksLimit: 12 },
      grid: { color: '#1a1a1e' },
    },
    y: {
      ticks: { color: '#6b6b76', font: { size: 10 } },
      grid: { color: '#1a1a1e' },
    },
  },
};

function makeScale(id, position, label, color) {
  return {
    [id]: {
      type: 'linear', position, display: true,
      title: { display: true, text: label, color, font: { size: 11 } },
      ticks: { color, font: { size: 10 } },
      grid: { color: position === 'left' ? '#1a1a1e' : 'transparent' },
    }
  };
}

// ── Render ───────────────────────────────────────────────────────────────────
async function init() {
  let data;
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="loading">Failed to load data. Run refresh_situation.py first.<br><small>${e.message}</small></div>`;
    return;
  }

  const app = document.getElementById('app');
  app.innerHTML = '';

  // ─── Hero ───
  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.innerHTML = `
    <h1>The Situation: Monitoring</h1>
    <div class="subtitle">Geopolitical Oil Shock Transmission Tracker &mdash; Iran Conflict &amp; Strait of Hormuz</div>
    <div class="updated">Last updated: ${data.metadata.last_updated}</div>
  `;
  app.appendChild(hero);

  // ─── Status Banner ───
  const threat = data.threat;
  const narrative = data.narrative;
  const banner = document.createElement('div');
  banner.className = `status-banner level-${threat.level}`;
  banner.innerHTML = `
    <div class="status-level ${threat.level}">${threat.level}</div>
    <div class="status-text">${narrative.status_line}</div>
    <div class="status-score">
      <div class="number">${threat.score}</div>
      <div class="label">Threat Score</div>
    </div>
  `;
  app.appendChild(banner);

  // ─── KPI Row ───
  const kpis = data.kpis;
  const oilRisk = data.oil_risk_premium;
  const credit = data.credit_spread;

  const kpiData = [
    { label: 'WTI Crude', value: '$' + fmt(kpis.wti?.current), changes: kpis.wti },
    { label: 'Brent Crude', value: '$' + fmt(kpis.brent?.current), changes: kpis.brent },
    { label: '10Y Yield', value: fmt(kpis.tnx?.current, 3) + '%', changes: kpis.tnx },
    { label: 'Credit Spread', value: fmt(credit.spread_proxy, 3) + '%', detail: credit.spread_direction },
    { label: 'VIX', value: fmt(kpis.vix?.current, 1), changes: kpis.vix },
    { label: 'Oil Risk Premium', value: (oilRisk.brent_premium > 0 ? '+' : '') + fmt(oilRisk.brent_premium), detail: fmt(oilRisk.brent_premium_pct) + '% vs 90d SMA' },
  ];

  const kpiGrid = document.createElement('div');
  kpiGrid.className = 'grid grid-6';
  kpiGrid.style.marginBottom = '32px';
  for (const k of kpiData) {
    const card = document.createElement('div');
    card.className = 'kpi-card';
    let changesHtml = '';
    if (k.changes) {
      changesHtml = `<div class="kpi-changes">
        <span>1d: ${fmtChg(k.changes.chg_1d)}</span>
        <span>7d: ${fmtChg(k.changes.chg_7d)}</span>
        <span>30d: ${fmtChg(k.changes.chg_30d)}</span>
      </div>`;
    }
    if (k.detail) {
      changesHtml += `<div class="kpi-detail">${k.detail}</div>`;
    }
    card.innerHTML = `
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      ${changesHtml}
    `;
    kpiGrid.appendChild(card);
  }
  app.appendChild(kpiGrid);

  // ─── Transmission Chain ───
  const chainSection = document.createElement('div');
  chainSection.className = 'panel';
  chainSection.style.marginBottom = '32px';

  const chain = data.transmission_chain.links;
  const chainNodes = [
    { key: 'oil_spike', label: 'Oil Spike' },
    { key: 'inflation_expectations', label: 'Inflation Exp.' },
    { key: 'bond_yields', label: 'Bond Yields' },
    { key: 'credit_spreads', label: 'Credit Spreads' },
    { key: 'equity_valuations', label: 'Equity Vals' },
  ];

  let chainHtml = '<h3 style="text-align:center;font-size:14px;font-weight:700;color:var(--white-soft);margin:0 0 16px;">Transmission Chain Status</h3><div class="chain-container">';
  chainNodes.forEach((node, i) => {
    const status = chain[node.key] || 'green';
    const statusLabel = status === 'red' ? 'ACTIVE' : status === 'yellow' ? 'WARNING' : 'INACTIVE';
    chainHtml += `<div class="chain-node ${status}">
      <div class="node-label">${node.label}</div>
      <div class="node-status">${statusLabel}</div>
    </div>`;
    if (i < chainNodes.length - 1) chainHtml += '<div class="chain-arrow">&rarr;</div>';
  });
  chainHtml += '</div>';
  chainSection.innerHTML = chainHtml;
  app.appendChild(chainSection);

  // ─── Correlation Badges ───
  const corr = data.correlations;
  const corrDiv = document.createElement('div');
  corrDiv.className = 'corr-badges';
  corrDiv.style.marginBottom = '32px';
  corrDiv.innerHTML = `
    <div class="corr-badge">Oil-Yield 30d Corr: <strong>${fmt(corr.oil_yield_30d, 3)}</strong></div>
    <div class="corr-badge">Oil-Yield 60d Corr: <strong>${fmt(corr.oil_yield_60d, 3)}</strong></div>
    <div class="corr-badge">Oil-Yield 100d Corr: <strong>${fmt(corr.oil_yield_100d, 3)}</strong></div>
  `;
  app.appendChild(corrDiv);

  // ─── Charts Section Header ───
  const chartsHeader = document.createElement('div');
  chartsHeader.className = 'section-header';
  chartsHeader.textContent = 'Market Charts';
  app.appendChild(chartsHeader);

  // ─── Charts 2-Column Grid ───
  const chartGrid = document.createElement('div');
  chartGrid.className = 'grid grid-2';
  chartGrid.style.marginBottom = '32px';
  app.appendChild(chartGrid);

  const charts = data.charts;

  // 1. Oil Price History
  const oilBox = createChartBox('Oil Price History (6M)', 'oilChart');
  chartGrid.appendChild(oilBox);

  // 2. Credit Spread Monitor
  const creditBox = createChartBox('Credit Spread Monitor (LQD vs SMA)', 'creditChart');
  chartGrid.appendChild(creditBox);

  // 3. Oil vs 10Y Yield
  const oilYieldBox = createChartBox('Oil vs 10Y Treasury Yield', 'oilYieldChart');
  chartGrid.appendChild(oilYieldBox);

  // 4. VIX + Gold
  const vixGoldBox = createChartBox('VIX + Gold (Safe Haven Gauge)', 'vixGoldChart');
  chartGrid.appendChild(vixGoldBox);

  // 5. Yield Curve
  const ycBox = createChartBox('Yield Curve History', 'ycChart');
  chartGrid.appendChild(ycBox);

  // 6. Energy vs S&P 500
  const relBox = createChartBox('Energy (XLE) vs S&P 500 Relative Performance', 'relChart');
  chartGrid.appendChild(relBox);

  // ─── AAII Sentiment Survey ───
  if (data.aaii && data.aaii.history && data.aaii.history.dates.length > 0) {
    const aaii = data.aaii;
    const sentHeader = document.createElement('div');
    sentHeader.className = 'section-header';
    sentHeader.textContent = 'Investor Sentiment';
    app.appendChild(sentHeader);

    // Sentiment KPI + Signal row
    const sentInfo = document.createElement('div');
    sentInfo.className = 'panel';
    sentInfo.style.marginBottom = '24px';
    sentInfo.style.display = 'flex';
    sentInfo.style.alignItems = 'center';
    sentInfo.style.gap = '24px';
    sentInfo.style.flexWrap = 'wrap';

    const cur = aaii.current;
    const avg = aaii.historical_avg;
    const bullDev = cur.bullish != null ? (cur.bullish - avg.bullish).toFixed(1) : '—';
    const bearDev = cur.bearish != null ? (cur.bearish - avg.bearish).toFixed(1) : '—';

    sentInfo.innerHTML = `
      <div style="flex:1;min-width:200px;">
        <div style="font-size:11px;font-weight:700;color:var(--gray-light);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;">AAII Sentiment Survey</div>
        <div style="font-size:13px;color:var(--white-soft);line-height:1.6;">
          Week ending ${cur.date || '—'}<br>
          <span style="color:#00d26a;font-weight:700;">Bullish ${fmt(cur.bullish, 1)}%</span>
          <span style="color:var(--gray-muted);margin:0 6px;">|</span>
          <span style="color:var(--gray-light);font-weight:700;">Neutral ${fmt(cur.neutral, 1)}%</span>
          <span style="color:var(--gray-muted);margin:0 6px;">|</span>
          <span style="color:#ff4444;font-weight:700;">Bearish ${fmt(cur.bearish, 1)}%</span>
        </div>
      </div>
      <div style="flex:1;min-width:200px;">
        <div style="font-size:11px;font-weight:700;color:var(--gray-light);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;">Bull-Bear Spread</div>
        <div style="font-size:28px;font-weight:800;color:${(cur.bull_bear_spread||0) >= 0 ? '#00d26a' : '#ff4444'};">
          ${(cur.bull_bear_spread||0) >= 0 ? '+' : ''}${fmt(cur.bull_bear_spread, 1)}
        </div>
        <div style="font-size:11px;color:var(--gray-muted);">vs avg: Bull ${bullDev > 0 ? '+' : ''}${bullDev} | Bear ${bearDev > 0 ? '+' : ''}${bearDev}</div>
      </div>
      <div style="flex:1;min-width:200px;">

    </div>

    </div>
    <div class="narrative-section">
      <h4>Risk Assessment</h4>
      <p>${narrative.risk_summary}</p>
    </div>
  `;
  app.appendChild(assessPanel);

  // ─── Key Levels ───
  const levelsHeader = document.createElement('div');
  levelsHeader.className = 'section-header';
  levelsHeader.textContent = 'Crisis Levels to Watch';
  app.appendChild(levelsHeader);

  const levels = data.key_levels;
  const levelsGrid = document.createElement('div');
  levelsGrid.className = 'levels-grid';
  levelsGrid.style.marginBottom = '32px';

  const levelEntries = [
    { name: 'Oil Elevated', key: 'oil_elevated', current: kpis.wti?.current, unit: '$' },
    { name: 'Oil High', key: 'oil_high', current: kpis.wti?.current, unit: '$' },
    { name: 'Oil Critical', key: 'oil_critical', current: kpis.wti?.current, unit: '$' },
    { name: '10Y Elevated', key: 'tnx_elevated', current: kpis.tnx?.current, unit: '%' },
    { name: '10Y High', key: 'tnx_high', current: kpis.tnx?.current, unit: '%' },
    { name: 'VIX Elevated', key: 'vix_elevated', current: kpis.vix?.current, unit: '' },
    { name: 'VIX High', key: 'vix_high', current: kpis.vix?.current, unit: '' },
    { name: 'VIX Critical', key: 'vix_critical', current: kpis.vix?.current, unit: '' },
  ];

  for (const le of levelEntries) {
    const threshold = levels[le.key];
    const breached = le.current != null && le.current >= threshold;
    const card = document.createElement('div');
    card.className = 'level-card' + (breached ? ' breached' : '');
    card.innerHTML = `
      <span class="level-name">${le.name}</span>
      <span class="level-value">${le.unit}${threshold}${le.unit === '%' ? '%' : ''}</span>
    `;
    levelsGrid.appendChild(card);
  }
  app.appendChild(levelsGrid);
}

  box.innerHTML = `<h3>${title}</h3><div class="chart-wrapper${tall ? ' tall' : ''}"><canvas id="${canvasId}"></canvas></div>`;
  return box;
}

function renderHyOasChart(d) {
  // Format dates as "MMM 'YY" for readability on dense daily data
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const formattedLabels = d.dates.map(ds => {
    const parts = ds.split('-');
    return months[parseInt(parts[1], 10) - 1] + ' ' + parts[2] + ', ' + parts[0].slice(2);
  });

  new Chart(document.getElementById('hyOasChart'), {
    type: 'line',
    data: {
      labels: formattedLabels,
      datasets: [
        {
          label: 'HY OAS (%)',
          data: d.values,
          borderColor: '#ff4d7d',
          backgroundColor: 'rgba(255,77,125,0.12)',
          borderWidth: 2, pointRadius: 0, tension: 0.3, fill: true,
        },
        {
          label: 'Period Average',
          data: d.dates.map(() => d.sma),
          borderColor: '#ffb80080',
          borderWidth: 1.5, borderDash: [6,3], pointRadius: 0,
        },
      ],
    },
    options: {
      ...chartDefaults,
      plugins: {
        ...chartDefaults.plugins,
        tooltip: {
          ...chartDefaults.plugins.tooltip,
          callbacks: {
            title: ctx => formattedLabels[ctx[0].dataIndex],
            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}%`,
          },
        },
      },
      scales: {
        x: {
          ticks: {
            color: '#6b6b76',
            font: { size: 10 },
            maxTicksLimit: 12,
            callback: function(value, index) {
              // Show only 1st of each month for clean labels
              const raw = d.dates[index];
              if (!raw) return null;
              const day = parseInt(raw.split('-')[2], 10);
              if (day <= 3) {
                const parts = raw.split('-');
                return months[parseInt(parts[1], 10) - 1] + " '" + parts[0].slice(2);
              }
              return null;
            },
            autoSkip: false,
            maxRotation: 0,
          },
          grid: { color: '#1a1a1e' },
        },
        y: {
          ...chartDefaults.scales.y,
          title: { display: true, text: 'Spread (%)', color: '#9999a5', font: { size: 11 } },
        },
      },
    },
  });
}

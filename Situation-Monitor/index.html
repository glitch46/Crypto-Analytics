<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Situation — Crypto Analytics</title>
  <meta name="description" content="Geopolitical oil-shock transmission tracker: crude, yields, credit, VIX and equity stress in one read on the tape." />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <main class="page">
    <div id="app">
      <div class="loading">Loading situation data...</div>
    </div>
  </main>

  <script src="../assets/js/dashboard.js"></script>
  <script src="../assets/js/particles.js"></script>
  <script>
const DATA_URL = 'data/situation.json';

function fmt(v, decimals = 2) {
  if (v == null) return '—';
  return Number(v).toFixed(decimals);
}
function fmtChg(v) {
  if (v == null) return '<span class="neutral">—</span>';
  const cls = v > 0 ? 'positive' : v < 0 ? 'negative' : 'neutral';
  const sign = v > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${v.toFixed(2)}%</span>`;
}
function statusColor(status) {
  return { green: '#00d26a', yellow: '#ffb800', red: '#f43737' }[status] || '#6b6b76';
}

const chartDefaults = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: {
    legend: { labels: { color: '#9999a5', font: { family: 'Montserrat', size: 11 } } },
    tooltip: {
      backgroundColor: '#141416',
      titleColor: '#fff',
      bodyColor: '#e8e8ed',
      borderColor: '#2e2e33',
      borderWidth: 1,
    },
  },
  scales: {
    x: {
      ticks: { color: '#6b6b76', font: { size: 10 }, maxTicksLimit: 12 },
      grid: { color: '#232326' },
    },
    y: {
      ticks: { color: '#6b6b76', font: { size: 10 } },
      grid: { color: '#232326' },
    },
  },
};

function makeScale(id, position, label, color) {
  return {
    [id]: {
      type: 'linear', position, display: true,
      title: { display: true, text: label, color, font: { size: 11 } },
      ticks: { color, font: { size: 10 } },
      grid: { color: position === 'left' ? '#232326' : 'transparent' },
    }
  };
}

async function init() {
  let data;
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="loading">Failed to load data. Run refresh_situation.py first.<br><small>${e.message}</small></div>`;
    return;
  }

  const app = document.getElementById('app');
  app.innerHTML = '';

  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.innerHTML = `
    <h1>The <b>Situation.</b></h1>
    <div class="subtitle">Geopolitical Oil Shock Transmission Tracker &mdash; Iran Conflict &amp; Strait of Hormuz</div>
    <div class="updated">Last updated: ${data.metadata.last_updated}</div>
  `;
  app.appendChild(hero);

  const threat = data.threat;
  const narrative = data.narrative;
  const banner = document.createElement('div');
  banner.className = `status-banner level-${threat.level}`;
  banner.innerHTML = `
    <div class="status-level ${threat.level}">${threat.level}</div>
    <div class="status-text">${narrative.status_line}</div>
    <div class="status-score">
      <div class="number">${threat.score}</div>
      <div class="label">Threat Score</div>
    </div>
  `;
  app.appendChild(banner);

  const kpis = data.kpis;
  const oilRisk = data.oil_risk_premium;
  const credit = data.credit_spread;

  const kpiData = [
    { label: 'WTI Crude', value: '$' + fmt(kpis.wti?.current), changes: kpis.wti },
    { label: 'Brent Crude', value: '$' + fmt(kpis.brent?.current), changes: kpis.brent },
    { label: '10Y Yield', value: fmt(kpis.tnx?.current, 3) + '%', changes: kpis.tnx },
    { label: 'Credit Spread', value: fmt(credit.spread_proxy, 3) + '%', detail: credit.spread_direction },
    { label: 'VIX', value: fmt(kpis.vix?.current, 1), changes: kpis.vix },
    { label: 'Oil Risk Premium', value: (oilRisk.brent_premium > 0 ? '+' : '') + fmt(oilRisk.brent_premium), detail: fmt(oilRisk.brent_premium_pct) + '% vs 90d SMA' },
  ];

  const kpiGrid = document.createElement('div');
  kpiGrid.className = 'grid grid-6';
  kpiGrid.style.marginBottom = '32px';
  for (const k of kpiData) {
    const card = document.createElement('div');
    card.className = 'kpi-card';
    let changesHtml = '';
    if (k.changes) {
      changesHtml = `<div class="kpi-changes">
        <span>1d: ${fmtChg(k.changes.chg_1d)}</span>
        <span>7d: ${fmtChg(k.changes.chg_7d)}</span>
        <span>30d: ${fmtChg(k.changes.chg_30d)}</span>
      </div>`;
    }
    if (k.detail) {
      changesHtml += `<div class="kpi-detail">${k.detail}</div>`;
    }
    card.innerHTML = `
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      ${changesHtml}
    `;
    kpiGrid.appendChild(card);
  }
  app.appendChild(kpiGrid);

  const chainSection = document.createElement('div');
  chainSection.className = 'panel';
  chainSection.style.marginBottom = '32px';

  const chain = data.transmission_chain.links;
  const chainNodes = [
    { key: 'oil_spike', label: 'Oil Spike' },
    { key: 'inflation_expectations', label: 'Inflation Exp.' },
    { key: 'bond_yields', label: 'Bond Yields' },
    { key: 'credit_spreads', label: 'Credit Spreads' },
    { key: 'equity_valuations', label: 'Equity Vals' },
  ];

  let chainHtml = '<div class="panel-label" style="text-align:center;">Transmission Chain Status</div><div class="chain-container">';
  chainNodes.forEach((node, i) => {
    const status = chain[node.key] || 'green';
    const statusLabel = status === 'red' ? 'ACTIVE' : status === 'yellow' ? 'WARNING' : 'INACTIVE';
    chainHtml += `<div class="chain-node ${status}">
      <div class="node-label">${node.label}</div>
      <div class="node-status">${statusLabel}</div>
    </div>`;
    if (i < chainNodes.length - 1) chainHtml += '<div class="chain-arrow">&rarr;</div>';
  });
  chainHtml += '</div>';
  chainSection.innerHTML = chainHtml;
  app.appendChild(chainSection);

  const corr = data.correlations;
  const corrDiv = document.createElement('div');
  corrDiv.className = 'corr-badges';
  corrDiv.style.marginBottom = '32px';
  corrDiv.innerHTML = `
    <div class="corr-badge">Oil-Yield 30d Corr: <strong>${fmt(corr.oil_yield_30d, 3)}</strong></div>
    <div class="corr-badge">Oil-Yield 60d Corr: <strong>${fmt(corr.oil_yield_60d, 3)}</strong></div>
    <div class="corr-badge">Oil-Yield 100d Corr: <strong>${fmt(corr.oil_yield_100d, 3)}</strong></div>
  `;
  app.appendChild(corrDiv);

  const chartsHeader = document.createElement('div');
  chartsHeader.className = 'section-header';
  chartsHeader.innerHTML = 'Market <b>Charts</b>';
  app.appendChild(chartsHeader);

  const chartGrid = document.createElement('div');
  chartGrid.className = 'grid grid-2';
  chartGrid.style.marginBottom = '32px';
  app.appendChild(chartGrid);

  const charts = data.charts;

  chartGrid.appendChild(createChartBox('Oil Price History (6M)', 'oilChart'));
  chartGrid.appendChild(createChartBox('Credit Spread Monitor (LQD vs SMA)', 'creditChart'));
  chartGrid.appendChild(createChartBox('Oil vs 10Y Treasury Yield', 'oilYieldChart'));
  chartGrid.appendChild(createChartBox('VIX + Gold (Safe Haven Gauge)', 'vixGoldChart'));
  chartGrid.appendChild(createChartBox('Yield Curve History', 'ycChart'));
  chartGrid.appendChild(createChartBox('Energy (XLE) vs S&P 500 Relative Performance', 'relChart'));

  if (data.aaii && data.aaii.history && data.aaii.history.dates.length > 0) {
    const aaii = data.aaii;
    const sentHeader = document.createElement('div');
    sentHeader.className = 'section-header';
    sentHeader.innerHTML = 'Investor <b>Sentiment</b>';
    app.appendChild(sentHeader);

    const sentInfo = document.createElement('div');
    sentInfo.className = 'panel';
    sentInfo.style.marginBottom = '24px';
    sentInfo.style.display = 'flex';
    sentInfo.style.alignItems = 'center';
    sentInfo.style.gap = '24px';
    sentInfo.style.flexWrap = 'wrap';

    const cur = aaii.current;
    const avg = aaii.historical_avg;
    const bullDev = cur.bullish != null ? (cur.bullish - avg.bullish).toFixed(1) : '—';
    const bearDev = cur.bearish != null ? (cur.bearish - avg.bearish).toFixed(1) : '—';

    sentInfo.innerHTML = `
      <div style="flex:1;min-width:200px;">
        <div class="panel-label" style="margin-bottom:6px;">AAII Sentiment Survey</div>
        <div style="font-size:13px;color:var(--soft);line-height:1.6;">
          Week ending ${cur.date || '—'}<br>
          <span style="color:#00d26a;font-weight:700;">Bullish ${fmt(cur.bullish, 1)}%</span>
          <span style="color:var(--gray-dim);margin:0 6px;">|</span>
          <span style="color:var(--gray);font-weight:700;">Neutral ${fmt(cur.neutral, 1)}%</span>
          <span style="color:var(--gray-dim);margin:0 6px;">|</span>
          <span style="color:#f43737;font-weight:700;">Bearish ${fmt(cur.bearish, 1)}%</span>
        </div>
      </div>
      <div style="flex:1;min-width:200px;">
        <div class="panel-label" style="margin-bottom:6px;">Bull-Bear Spread</div>
        <div style="font-size:28px;font-weight:800;color:${(cur.bull_bear_spread||0) >= 0 ? '#00d26a' : '#f43737'};">
          ${(cur.bull_bear_spread||0) >= 0 ? '+' : ''}${fmt(cur.bull_bear_spread, 1)}
        </div>
        <div style="font-size:11px;color:var(--gray-dim);">vs avg: Bull ${bullDev > 0 ? '+' : ''}${bullDev} | Bear ${bearDev > 0 ? '+' : ''}${bearDev}</div>
      </div>
      <div style="flex:1;min-width:200px;">
        <div class="panel-label" style="margin-bottom:6px;">Contrarian Signal</div>
        <div style="font-size:13px;font-weight:600;color:var(--soft);">${aaii.signal}</div>
      </div>
    `;
    app.appendChild(sentInfo);

    const aaiGrid = document.createElement('div');
    aaiGrid.className = 'grid grid-2';
    aaiGrid.style.marginBottom = '32px';
    app.appendChild(aaiGrid);

    aaiGrid.appendChild(createChartBox('AAII Sentiment Breakdown (Weekly)', 'aaiStackChart'));
    aaiGrid.appendChild(createChartBox('Bull-Bear Spread', 'aaiSpreadChart'));

    renderAAIIStackedChart(aaii.history);
    renderAAIISpreadChart(aaii.history);
  }

  const fwHeader = document.createElement('div');
  fwHeader.className = 'section-header';
  fwHeader.innerHTML = 'The Big <b>Picture</b>';
  app.appendChild(fwHeader);

  const bigBox = createChartBox('Oil → Yields → Equities (6M)', 'bigChart', true);
  bigBox.style.marginBottom = '24px';
  app.appendChild(bigBox);

  const hygBox = createChartBox('HYG vs TLT — Credit Stress Indicator', 'hygChart', true);
  hygBox.style.marginBottom = '24px';
  app.appendChild(hygBox);

  if (data.hy_spread && data.hy_spread.dates && data.hy_spread.dates.length > 0) {
    const hy = data.hy_spread;
    const hyBox = createChartBox('ICE BofA US High Yield Index Option-Adjusted Spread', 'hyOasChart', true);
    hyBox.style.marginBottom = '32px';

    const hyInfo = document.createElement('div');
    hyInfo.style.cssText = 'display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;';
    hyInfo.innerHTML = `
      <span class="corr-badge">Current: <strong>${fmt(hy.current, 2)}%</strong></span>
      <span class="corr-badge">1d: <strong style="color:${(hy.chg_1d||0) > 0 ? 'var(--danger)' : 'var(--success)'}">${hy.chg_1d != null ? ((hy.chg_1d > 0 ? '+' : '') + fmt(hy.chg_1d, 2)) : '—'}</strong></span>
      <span class="corr-badge">7d: <strong style="color:${(hy.chg_7d||0) > 0 ? 'var(--danger)' : 'var(--success)'}">${hy.chg_7d != null ? ((hy.chg_7d > 0 ? '+' : '') + fmt(hy.chg_7d, 2)) : '—'}</strong></span>
      <span class="corr-badge">30d: <strong style="color:${(hy.chg_30d||0) > 0 ? 'var(--danger)' : 'var(--success)'}">${hy.chg_30d != null ? ((hy.chg_30d > 0 ? '+' : '') + fmt(hy.chg_30d, 2)) : '—'}</strong></span>
      <span class="corr-badge">1Y Avg: <strong>${fmt(hy.sma, 2)}%</strong></span>
    `;
    hyBox.querySelector('h3').after(hyInfo);
    app.appendChild(hyBox);
    renderHyOasChart(hy);
  }

  renderOilChart(charts.oil_history);
  renderCreditChart(charts.credit_spread);
  renderOilYieldChart(charts.oil_vs_yield);
  renderVixGoldChart(charts.vix_gold);
  renderYieldCurveChart(charts.yield_curve);
  renderRelPerfChart(charts.relative_perf);
  renderBigPictureChart(charts.big_picture);
  renderHygTltChart(charts.hyg_tlt);

  const assessHeader = document.createElement('div');
  assessHeader.className = 'section-header';
  assessHeader.innerHTML = 'Thesis <b>Assessment</b>';
  app.appendChild(assessHeader);

  const assessPanel = document.createElement('div');
  assessPanel.className = 'panel';
  assessPanel.style.marginBottom = '32px';
  assessPanel.innerHTML = `
    <div class="narrative-section">
      <h4>Supply Shock vs Demand</h4>
      <p>${narrative.supply_demand}</p>
    </div>
    <div class="narrative-section">
      <h4>Fed Watch</h4>
      <p>${narrative.fed_watch}</p>
    </div>
    <div class="narrative-section">
      <h4>Credit Market Signal</h4>
      <p>${narrative.credit_signal}</p>
    </div>
    <div class="narrative-section">
      <h4>Historical Analog</h4>
      <p>${narrative.historical_analog}</p>
    </div>
    <div class="narrative-section">
      <h4>Risk Assessment</h4>
      <p>${narrative.risk_summary}</p>
    </div>
  `;
  app.appendChild(assessPanel);

  const levelsHeader = document.createElement('div');
  levelsHeader.className = 'section-header';
  levelsHeader.innerHTML = 'Crisis Levels to <b>Watch</b>';
  app.appendChild(levelsHeader);

  const levels = data.key_levels;
  const levelsGrid = document.createElement('div');
  levelsGrid.className = 'levels-grid';
  levelsGrid.style.marginBottom = '32px';

  const levelEntries = [
    { name: 'Oil Elevated', key: 'oil_elevated', current: kpis.wti?.current, unit: '$' },
    { name: 'Oil High', key: 'oil_high', current: kpis.wti?.current, unit: '$' },
    { name: 'Oil Critical', key: 'oil_critical', current: kpis.wti?.current, unit: '$' },
    { name: '10Y Elevated', key: 'tnx_elevated', current: kpis.tnx?.current, unit: '%' },
    { name: '10Y High', key: 'tnx_high', current: kpis.tnx?.current, unit: '%' },
    { name: 'VIX Elevated', key: 'vix_elevated', current: kpis.vix?.current, unit: '' },
    { name: 'VIX High', key: 'vix_high', current: kpis.vix?.current, unit: '' },
    { name: 'VIX Critical', key: 'vix_critical', current: kpis.vix?.current, unit: '' },
  ];

  for (const le of levelEntries) {
    const threshold = levels[le.key];
    const breached = le.current != null && le.current >= threshold;
    const card = document.createElement('div');
    card.className = 'level-card' + (breached ? ' breached' : '');
    card.innerHTML = `
      <span class="level-name">${le.name}</span>
      <span class="level-value">${le.unit}${threshold}${le.unit === '%' ? '%' : ''}</span>
    `;
    levelsGrid.appendChild(card);
  }
  app.appendChild(levelsGrid);
}

function createChartBox(title, canvasId, tall) {
  const box = document.createElement('div');
  box.className = 'chart-box';
  box.innerHTML = `<h3>${title}</h3><div class="chart-wrapper${tall ? ' tall' : ''}"><canvas id="${canvasId}"></canvas></div>`;
  return box;
}

function renderOilChart(d) {
  new Chart(document.getElementById('oilChart'), {
    type: 'line',
    data: {
      labels: d.dates,
      datasets: [
        { label: 'Brent', data: d.brent, borderColor: '#f43737', borderWidth: 2, pointRadius: 0, tension: 0.3 },
        { label: 'WTI', data: d.wti, borderColor: '#0051FF', borderWidth: 2, pointRadius: 0, tension: 0.3 },
        { label: 'Brent SMA20', data: d.brent_sma20, borderColor: '#f4373760', borderWidth: 1, borderDash: [4,4], pointRadius: 0, tension: 0.3 },
        { label: 'Brent SMA90', data: d.brent_sma90, borderColor: '#ffb80060', borderWidth: 1, borderDash: [6,3], pointRadius: 0, tension: 0.3 },
      ],
    },
    options: { ...chartDefaults },
  });
}

function renderCreditChart(d) {
  new Chart(document.getElementById('creditChart'), {
    type: 'line',
    data: {
      labels: d.dates,
      datasets: [
        {
          label: 'Spread Proxy (%)',
          data: d.spread_proxy,
          borderColor: '#f43737',
          backgroundColor: 'rgba(244,55,55,0.1)',
          borderWidth: 2, pointRadius: 0, tension: 0.3, fill: true,
        },
      ],
    },
    options: { ...chartDefaults },
  });
}

function renderOilYieldChart(d) {
  new Chart(document.getElementById('oilYieldChart'), {
    type: 'line',
    data: {
      labels: d.dates,
      datasets: [
        { label: 'Brent ($)', data: d.brent, borderColor: '#f43737', borderWidth: 2, pointRadius: 0, tension: 0.3, yAxisID: 'y' },
        { label: '10Y Yield (%)', data: d.tnx, borderColor: '#00d26a', borderWidth: 2, pointRadius: 0, tension: 0.3, yAxisID: 'y1' },
      ],
    },
    options: {
      ...chartDefaults,
      scales: {
        x: chartDefaults.scales.x,
        y: { type: 'linear', position: 'left', display: true, title: { display: true, text: 'Brent ($)', color: '#f43737', font: { size: 11 } }, ticks: { color: '#f43737', font: { size: 10 } }, grid: { color: '#232326' } },
        y1: { type: 'linear', position: 'right', display: true, title: { display: true, text: '10Y Yield (%)', color: '#00d26a', font: { size: 11 } }, ticks: { color: '#00d26a', font: { size: 10 } }, grid: { drawOnChartArea: false } },
      },
    },
  });
}

function renderVixGoldChart(d) {
  new Chart(document.getElementById('vixGoldChart'), {
    type: 'line',
    data: {
      labels: d.dates,
      datasets: [
        { label: 'VIX', data: d.vix, borderColor: '#f43737', borderWidth: 2, pointRadius: 0, tension: 0.3, yAxisID: 'y' },
        { label: 'Gold ($)', data: d.gold, borderColor: '#ffb800', borderWidth: 2, pointRadius: 0, tension: 0.3, yAxisID: 'y1' },
      ],
    },
    options: {
      ...chartDefaults,
      scales: {
        x: chartDefaults.scales.x,
        y: { type: 'linear', position: 'left', display: true, title: { display: true, text: 'VIX', color: '#f43737', font: { size: 11 } }, ticks: { color: '#f43737', font: { size: 10 } }, grid: { color: '#232326' } },
        y1: { type: 'linear', position: 'right', display: true, title: { display: true, text: 'Gold ($)', color: '#ffb800', font: { size: 11 } }, ticks: { color: '#ffb800', font: { size: 10 } }, grid: { drawOnChartArea: false } },
      },
    },
  });
}

function renderYieldCurveChart(d) {
  new Chart(document.getElementById('ycChart'), {
    type: 'line',
    data: {
      labels: d.dates,
      datasets: [
        { label: '13W', data: d.irx, borderColor: '#0051FF', borderWidth: 1.5, pointRadius: 0, tension: 0.3 },
        { label: '5Y', data: d.fvx, borderColor: '#00d26a', borderWidth: 1.5, pointRadius: 0, tension: 0.3 },
        { label: '10Y', data: d.tnx, borderColor: '#ffb800', borderWidth: 2, pointRadius: 0, tension: 0.3 },
        { label: '30Y', data: d.tyx, borderColor: '#f43737', borderWidth: 1.5, pointRadius: 0, tension: 0.3 },
      ],
    },
    options: { ...chartDefaults },
  });
}

function renderRelPerfChart(d) {
  new Chart(document.getElementById('relChart'), {
    type: 'line',
    data: {
      labels: d.dates,
      datasets: [
        { label: 'XLE (indexed)', data: d.xle, borderColor: '#f43737', borderWidth: 2, pointRadius: 0, tension: 0.3 },
        { label: 'S&P 500 (indexed)', data: d.spx, borderColor: '#0051FF', borderWidth: 2, pointRadius: 0, tension: 0.3 },
      ],
    },
    options: {
      ...chartDefaults,
      scales: {
        ...chartDefaults.scales,
        y: { ...chartDefaults.scales.y, title: { display: true, text: 'Indexed (100 = start)', color: '#9999a5', font: { size: 11 } } },
      },
    },
  });
}

function renderBigPictureChart(d) {
  new Chart(document.getElementById('bigChart'), {
    type: 'line',
    data: {
      labels: d.dates,
      datasets: [
        { label: 'WTI ($)', data: d.wti, borderColor: '#f43737', borderWidth: 2, pointRadius: 0, tension: 0.3, yAxisID: 'yOil' },
        { label: '10Y Yield (%)', data: d.tnx, borderColor: '#00d26a', borderWidth: 2, pointRadius: 0, tension: 0.3, yAxisID: 'yYield' },
        { label: 'S&P 500', data: d.spx, borderColor: '#0051FF', borderWidth: 2, pointRadius: 0, tension: 0.3, yAxisID: 'ySpx' },
      ],
    },
    options: {
      ...chartDefaults,
      scales: {
        x: chartDefaults.scales.x,
        yOil: { type: 'linear', position: 'left', display: true, title: { display: true, text: 'WTI ($)', color: '#f43737', font: { size: 11 } }, ticks: { color: '#f43737', font: { size: 10 } }, grid: { color: '#232326' } },
        yYield: { type: 'linear', position: 'right', display: true, title: { display: true, text: '10Y (%)', color: '#00d26a', font: { size: 11 } }, ticks: { color: '#00d26a', font: { size: 10 } }, grid: { drawOnChartArea: false } },
        ySpx: { type: 'linear', position: 'right', display: true, title: { display: true, text: 'S&P 500', color: '#0051FF', font: { size: 11 } }, ticks: { color: '#0051FF', font: { size: 10 } }, grid: { drawOnChartArea: false } },
      },
    },
  });
}

function renderHygTltChart(d) {
  new Chart(document.getElementById('hygChart'), {
    type: 'line',
    data: {
      labels: d.dates,
      datasets: [
        { label: 'HYG (indexed)', data: d.hyg, borderColor: '#f43737', borderWidth: 2, pointRadius: 0, tension: 0.3 },
        { label: 'TLT (indexed)', data: d.tlt, borderColor: '#0051FF', borderWidth: 2, pointRadius: 0, tension: 0.3 },
      ],
    },
    options: {
      ...chartDefaults,
      scales: {
        ...chartDefaults.scales,
        y: { ...chartDefaults.scales.y, title: { display: true, text: 'Indexed (100 = start)', color: '#9999a5', font: { size: 11 } } },
      },
    },
  });
}

function renderHyOasChart(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  let lastYM = '';
  const tickLabels = d.dates.map(ds => {
    const ym = ds.slice(0, 7);
    if (ym !== lastYM) {
      lastYM = ym;
      const parts = ds.split('-');
      return months[parseInt(parts[1], 10) - 1] + " '" + parts[0].slice(2);
    }
    return '';
  });

  new Chart(document.getElementById('hyOasChart'), {
    type: 'line',
    data: {
      labels: tickLabels,
      datasets: [
        {
          label: 'HY OAS (%)',
          data: d.values,
          borderColor: '#f43737',
          backgroundColor: 'rgba(244,55,55,0.12)',
          borderWidth: 2, pointRadius: 0, tension: 0.3, fill: true,
        },
        {
          label: 'Period Average',
          data: d.dates.map(() => d.sma),
          borderColor: '#ffb80080',
          borderWidth: 1.5, borderDash: [6,3], pointRadius: 0,
        },
      ],
    },
    options: {
      ...chartDefaults,
      plugins: {
        ...chartDefaults.plugins,
        tooltip: {
          ...chartDefaults.plugins.tooltip,
          callbacks: {
            title: function(ctx) {
              const i = ctx[0].dataIndex;
              const raw = d.dates[i];
              if (!raw) return '';
              const parts = raw.split('-');
              return months[parseInt(parts[1], 10) - 1] + ' ' + parseInt(parts[2], 10) + ', ' + parts[0];
            },
            label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}%`,
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#6b6b76', font: { size: 10 }, autoSkip: true, maxTicksLimit: 12, maxRotation: 0 },
          grid: { color: '#232326' },
        },
        y: {
          ...chartDefaults.scales.y,
          title: { display: true, text: 'Spread (%)', color: '#9999a5', font: { size: 11 } },
        },
      },
    },
  });
}

function renderAAIIStackedChart(d) {
  new Chart(document.getElementById('aaiStackChart'), {
    type: 'bar',
    data: {
      labels: d.dates,
      datasets: [
        { label: 'Bullish %', data: d.bullish, backgroundColor: '#00d26a', borderRadius: 2 },
        { label: 'Neutral %', data: d.neutral, backgroundColor: '#6b6b76', borderRadius: 2 },
        { label: 'Bearish %', data: d.bearish, backgroundColor: '#f43737', borderRadius: 2 },
      ],
    },
    options: {
      ...chartDefaults,
      plugins: {
        ...chartDefaults.plugins,
        tooltip: { ...chartDefaults.plugins.tooltip, callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}%` } },
      },
      scales: {
        x: { ...chartDefaults.scales.x, stacked: true },
        y: { ...chartDefaults.scales.y, stacked: true, max: 100, title: { display: true, text: '% of Respondents', color: '#9999a5', font: { size: 11 } } },
      },
    },
  });
}

function renderAAIISpreadChart(d) {
  const colors = d.bull_bear_spread.map(v => v >= 0 ? '#00d26a' : '#f43737');
  const bgColors = d.bull_bear_spread.map(v => v >= 0 ? 'rgba(0,210,106,0.7)' : 'rgba(244,55,55,0.7)');
  new Chart(document.getElementById('aaiSpreadChart'), {
    type: 'bar',
    data: {
      labels: d.dates,
      datasets: [
        {
          label: 'Bull-Bear Spread',
          data: d.bull_bear_spread,
          backgroundColor: bgColors,
          borderColor: colors,
          borderWidth: 1,
          borderRadius: 3,
        },
      ],
    },
    options: {
      ...chartDefaults,
      plugins: {
        ...chartDefaults.plugins,
        tooltip: { ...chartDefaults.plugins.tooltip, callbacks: { label: ctx => `Spread: ${ctx.parsed.y >= 0 ? '+' : ''}${ctx.parsed.y.toFixed(1)}%` } },
      },
      scales: {
        x: chartDefaults.scales.x,
        y: { ...chartDefaults.scales.y, title: { display: true, text: 'Bullish - Bearish (%)', color: '#9999a5', font: { size: 11 } } },
      },
    },
  });
}

init();
  </script>
</body>
</html>

name: Refresh Crypto Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch crypto options data
        env:
          CRYPTODATADOWNLOAD_API_KEY: ${{ secrets.CRYPTODATADOWNLOAD_API_KEY }}
        run: python3 Crypto-Dashboard/scripts/refresh_crypto.py
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Crypto-Dashboard/data/*.json
          git commit -m "chore: refresh data" || echo "No changes"
          git push

name: Refresh Crypto Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: Secret scan
        run: |
          if rg -n "auth_token=|CRYPTODATADOWNLOAD_API_KEY|sk-[A-Za-z0-9]{20,}" .; then
            echo "Potential secret detected in repo" >&2
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Fetch crypto options data
        env:
          CRYPTODATADOWNLOAD_API_KEY: ${{ secrets.CRYPTODATADOWNLOAD_API_KEY }}
        run: python3 Crypto-Dashboard/scripts/refresh_crypto.py
      - name: Fetch trading indicators data
        run: python3 Trading-Indicators/scripts/refresh_trading_indicators.py
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Crypto-Dashboard/data/*.json
          git add Trading-Indicators/data/*.json
          git commit -m "chore: refresh data" || echo "No changes"
          git push
